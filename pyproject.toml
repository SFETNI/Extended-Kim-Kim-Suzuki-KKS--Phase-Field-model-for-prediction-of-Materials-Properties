[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-kks"
version = "2.0.0"
description = "Extended Kim-Kim-Suzuki phase-field model for Si precipitation in LPBF AlSi10Mg under non-isothermal heating"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Seifallah Fetni" },
    { name = "Jocelyn Delahaye" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "numba>=0.56",
    "matplotlib>=3.5",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
fftw = ["pyFFTW>=0.13"]
test = ["pytest>=7"]

[project.scripts]
pf-kks-run = "pf_kks.cli:main"

[project.urls]
Article = "https://doi.org/10.1016/j.commatsci.2024.113197"

[tool.setuptools.packages.find]
include = ["pf_kks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
extend-exclude = ["legacy_version"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]  # tensor indices i, j, k, l
