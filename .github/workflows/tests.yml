name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the full-size checks against the archived run (~5 min)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fftw,test]"
      - name: Tests
        run: python -m pytest
      - name: Full-size checks against the archived run
        if: ${{ inputs.slow }}
        run: python -m pytest -m slow
